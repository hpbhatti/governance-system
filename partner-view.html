<style>
  :root {
    --bg: #f5f3ee; --bg-card: #ffffff;
    --ink: #1a1f2e; --ink-muted: #5a6478; --ink-faint: #8a92a3;
    --line: #e4e0d6; --line-strong: #c8c2b0;
    --accent: #1a3a52; --accent-warm: #b8884a; --gold: #c9a96e;
    --green: #4a7c59; --amber: #c47e2a; --red: #b04540;
    --green-bg: #e8f0e8; --amber-bg: #faf0e0; --red-bg: #f5e0de;
    --shadow: 0 1px 2px rgba(26,31,46,0.04), 0 4px 12px rgba(26,31,46,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'IBM Plex Sans Arabic', 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.6; min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 60px; }

  .lang-toggle-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .submissions-btn { margin-inline-end: auto; padding: 6px 14px; border-radius: 6px; border: 0.5px solid var(--line-strong); background: var(--bg-card); font-size: 12px; cursor: pointer; font-family: inherit; color: var(--ink-muted); }
  .submissions-btn:hover { background: var(--bg); }
  .submission-row { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .submission-row:last-child { border-bottom: none; }
  .submission-status-badge { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 8px; text-transform: uppercase; }
  .submission-status-badge.pending { background: var(--amber-bg); color: var(--amber); }
  .submission-status-badge.approved { background: var(--green-bg); color: var(--green); }
  .submission-status-badge.rejected { background: var(--red-bg); color: var(--red); }
  .submission-reject-reason { font-size: 12px; color: var(--red); margin-top: 5px; padding: 6px 8px; background: var(--red-bg); border-radius: 6px; }
  .lang-toggle { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .lang-toggle button { border: none; background: var(--bg-card); color: var(--ink-muted); font-size: 12px; padding: 6px 14px; cursor: pointer; font-family: inherit; }
  .lang-toggle button.active { background: var(--accent); color: #fff; }

  .header { background: linear-gradient(180deg, #0a1628 0%, #132744 100%); border-radius: 16px; padding: 28px 32px 30px; margin-bottom: 24px; color: #e8dcc8; box-shadow: var(--shadow); text-align: center; }
  .header-logo { height: 34px; margin-bottom: 12px; opacity: 0.95; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.3)); }
  .header-brand-text { font-size: 18px; letter-spacing: 0.3px; text-transform: none; color: rgba(232,220,200,0.85); margin-bottom: 18px; }
  .header-divider { width: 40px; height: 1px; background: rgba(201,168,76,0.3); margin: 0 auto 22px; }
  .header-partner-label { font-size: 11px; color: rgba(201,168,76,0.7); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .header-partner { font-size: 25px; font-weight: 600; color: #f5f0e6; font-family: 'Reem Kufi', serif; margin-bottom: 6px; }
  .header-meta { font-size: 12px; color: rgba(232,220,200,0.4); }

  .kpi-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .kpi { background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
  .kpi-label { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .kpi-value { font-size: 26px; font-weight: 700; line-height: 1; font-family: 'Reem Kufi', serif; }
  .kpi.k-total .kpi-value { color: var(--accent); }
  .kpi.k-done .kpi-value { color: var(--green); }
  .kpi.k-open .kpi-value { color: var(--amber); }

  .project-section { margin-bottom: 24px; }
  .project-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 4px; border-bottom: 2px solid var(--accent-warm); margin-bottom: 10px; }
  .project-name { font-size: 22px; font-weight: 800; color: var(--accent); font-family: 'Reem Kufi', serif; }
  .project-eyebrow { font-size: 10px; font-weight: 600; color: var(--accent-warm); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 3px; }

  .delay-impact-box { display: flex; align-items: flex-start; gap: 8px; background: var(--red-bg); border: 1px solid rgba(176,69,64,0.25); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 12.5px; color: var(--red); }
  .critical-note-banner { display: flex; align-items: flex-start; gap: 8px; background: #fdf3d9; border: 1.5px solid #b8884a; border-radius: 8px; padding: 11px 13px; margin-bottom: 10px; font-size: 13px; color: #6b4a10; font-weight: 500; }
  .critical-note-banner .icon { flex-shrink: 0; }
  .big-picture { background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .bp-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .bp-progress-label { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.5px; }
  .bp-status-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
  .bp-bar-track { height: 8px; background: #eee8dc; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .bp-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .bp-footer { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-muted); }
  .delay-impact-box .icon { flex-shrink: 0; font-size: 15px; line-height: 1.3; }

  .task-card { background: var(--bg-card); border: 1px solid var(--line); border-inline-start: 4px solid var(--line-strong); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .task-card.st-completed { border-inline-start-color: var(--green); }
  .task-card.st-open { border-inline-start-color: var(--amber); }
  .task-card.st-overdue { border-inline-start-color: var(--red); background: var(--red-bg); }
  .task-card.st-missed { border-inline-start-color: var(--red); }

  .task-title { font-size: 14.5px; font-weight: 600; margin-bottom: 8px; unicode-bidi: plaintext; }
  .untranslated-note { font-size: 10.5px; font-weight: 400; color: var(--ink-faint); font-style: italic; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--ink-muted); align-items: center; unicode-bidi: isolate; }
  .task-meta > * { unicode-bidi: isolate; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 500; border: 1px solid transparent; }
  .badge.completed { background: var(--green-bg); color: var(--green); border-color: rgba(74,124,89,0.25); }
  .badge.open { background: var(--amber-bg); color: var(--amber); border-color: rgba(196,126,42,0.25); }
  .badge.overdue { background: var(--red-bg); color: var(--red); border-color: rgba(176,69,64,0.25); }
  .badge.missed { background: var(--red-bg); color: var(--red); border-color: rgba(176,69,64,0.25); }
  .badge.high { background: var(--red-bg); color: var(--red); }
  .badge.medium { background: var(--amber-bg); color: var(--amber); }
  .badge.low { background: #eef0f4; color: var(--ink-muted); }

  .subtask-list { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .subtask-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; font-size: 13px; color: var(--ink); border-bottom: 1px solid var(--line); }
  .subtask-row:last-child { border-bottom: none; }
  .subtask-title { flex: 1 1 auto; min-width: 140px; unicode-bidi: plaintext; }
  .subtask-tags { display: flex; align-items: center; gap: 8px; flex-shrink: 0; unicode-bidi: isolate; }
  .subtask-due { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; unicode-bidi: isolate; }

  .project-files-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; }
  .project-files-divider::before, .project-files-divider::after { content: ''; flex: 1; height: 1px; background: var(--line-strong); }
  .project-files-divider-label { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .files-section { padding: 10px 12px; background: #faf8f3; border: 1px solid var(--line); border-radius: 8px; }
  .files-title { font-size: 11.5px; font-weight: 600; color: var(--ink-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .file-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 12.5px; }
  .file-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .file-row a:hover { text-decoration: underline; }
  .file-size { color: var(--ink-faint); font-size: 11px; white-space: nowrap; }

  .state-box { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
  .propose-row { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .propose-btn { flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .propose-btn.secondary { background: var(--bg-card); color: var(--accent); }
  .propose-btn:hover { opacity: 0.9; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,22,40,0.55); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .modal-box { background: var(--bg-card); border-radius: 14px; padding: 22px; max-width: 400px; width: 100%; }
  .modal-box textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: inherit; font-size: 13px; margin: 12px 0; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line-strong); font-size: 13px; cursor: pointer; font-family: inherit; }
  .modal-actions .primary { background: var(--accent); color: #fff; border: none; }
  .state-box .icon { font-size: 40px; margin-bottom: 12px; }
  .state-box .msg { font-size: 15px; }
  .retry-btn { margin-top: 16px; padding: 10px 22px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .retry-btn:hover { background: var(--accent-warm); }

  .footer-note { text-align: center; font-size: 11px; color: var(--ink-faint); margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); }

  @media (max-width: 480px) {
    .kpi-strip { gap: 6px; }
    .kpi-value { font-size: 20px; }
    .header-partner { font-size: 20px; }
  }
</style>
</head>

function detectIsArabic(text) {
  return /[\u0600-\u06FF]/.test(text || '');
}

// Resolve a task's raw/legacy title into the correct language slot if the
// explicit slots are empty. Mirrors the same "detect then slot" logic the
// main app uses, so a task authored in Arabic (before bilingual splitting
// existed) is treated as Arabic text, not accidentally shown as English.
function normalizeTaskTitles(task) {
  if (!task.titleEn && !task.titleAr && task.titleRaw) {
    if (detectIsArabic(task.titleRaw)) task.titleAr = task.titleRaw;
    else task.titleEn = task.titleRaw;
  }
}

var currentLang = localStorage.getItem('partnerViewLang') || 'en';
var lastData = null;

// No third-party translation. This page shows ONLY what the main governance
// system itself has already translated (titleEn/titleAr). If a task was
// never opened in the other language inside the main app, there's genuinely
// no translation to show — rather than faking one with an unreliable
// external call, we show what IS available with a small language-mismatch
// note, which is more honest than a translation that might silently fail.
function ensureTitlesForLang(data, lang) {
  (data.tasks || []).forEach(normalizeTaskTitles);
  return Promise.resolve(); // nothing async needed — system data is already loaded
}

function partnerDisplayName(partner) {
  if (currentLang === 'ar') {
    return partner.nameAr || partner.nameRaw || partner.nameEn || partner.name || '';
  }
  return partner.nameEn || partner.nameRaw || partner.nameAr || partner.name || '';
}

function t(key) {
  var v = STR[currentLang][key];
  if (typeof v === 'function') {
    var args = Array.prototype.slice.call(arguments, 1);
    return v.apply(null, args);
  }
  return v;
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('partnerViewLang', lang);
  document.getElementById('html-root').setAttribute('lang', lang);
  document.getElementById('html-root').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-lang-ar').classList.toggle('active', lang === 'ar');
  setSubmissionsButtonLabel();
  // loading-msg only exists in the pre-data-load state — it's gone forever once
  // render() has run once, so this must NOT throw on later toggles (that used
  // to silently abort the rest of this function, including the re-render below).
  var loadingMsgEl = document.getElementById('loading-msg');
  if (loadingMsgEl) loadingMsgEl.textContent = lang === 'ar' ? 'جارٍ تحميل مهامك…' : 'Loading your tasks…';
  if (!lastData) return;
  render(lastData);
  ensureTitlesForLang(lastData, lang).then(function() { render(lastData); });
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

function fmtDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(currentLang === 'ar' ? 'ar' : 'en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  var d = new Date(iso); // full ISO timestamp, not date-only — includes the actual time
  if (isNaN(d)) return iso;
  return d.toLocaleDateString(currentLang === 'ar' ? 'ar' : 'en-US', { year: 'numeric', month: 'short', day: 'numeric' }) +
    ' · ' + d.toLocaleTimeString(currentLang === 'ar' ? 'ar' : 'en-US', { hour: 'numeric', minute: '2-digit' });
}

function fmtBytes(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return Math.round(bytes/1024) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function daysBetween(a, b) {
  var d1 = new Date(a + 'T00:00:00'), d2 = new Date(b + 'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function taskStatusClass(task) {
  if (task.status === 'completed') return 'completed';
  if (task.status === 'missed') return 'missed';
  if (task.dueDate && task.dueDate < todayStr()) return 'overdue';
  return 'open';
}

function taskTitle(task) {
  if (currentLang === 'ar') {
    return task.titleAr || task.titleRaw || task.titleEn || '';
  }
  return task.titleEn || task.titleRaw || task.titleAr || '';
}

function criticalNoteText(task) {
  if (!task.criticalNoteEn && !task.criticalNoteAr && !task.criticalNoteRaw) return '';
  if (currentLang === 'ar') {
    return task.criticalNoteAr || task.criticalNoteRaw || task.criticalNoteEn || '';
  }
  return task.criticalNoteEn || task.criticalNoteRaw || task.criticalNoteAr || '';
}

function projectName(project) {
  if (currentLang === 'ar') {
    return project.nameAr || project.nameRaw || project.nameEn || '';
  }
  return project.nameEn || project.nameRaw || project.nameAr || '';
}

// True when the title actually being shown is NOT in the currently selected
// language (i.e. the system genuinely has no translation for this task yet).
function isTitleUntranslated(task) {
  if (currentLang === 'ar') return !task.titleAr;
  return !task.titleEn;
}

function statusBadge(task) {
  var cls = taskStatusClass(task);
  var labels = { completed: t('stCompleted'), open: t('stOpen'), overdue: t('stOverdue'), missed: t('stMissed') };
  return '<span class="badge ' + cls + '">' + labels[cls] + '</span>';
}

function priorityBadge(p) {
  if (!p) return '';
  var labels = { high: t('pHigh'), medium: t('pMedium'), low: t('pLow') };
  return '<span class="badge ' + p + '">' + (labels[p] || p) + '</span>';
}

function renderSubtasks(subtasks) {
  if (!subtasks.length) return '';
  return '<div class="subtask-list">' + subtasks.map(function(st) {
    return '<div class="subtask-row">' +
      '<span class="subtask-title">◦ ' + escapeHtml(taskTitle(st)) + '</span>' +
      '<span class="subtask-tags">' + statusBadge(st) + '<span class="subtask-due">📅 ' + fmtDate(st.dueDate) + '</span></span>' +
    '</div>';
  }).join('') + '</div>';
}

function renderTaskCard(task, subtasks) {
  var cls = taskStatusClass(task);
  var delay = task.dueDate ? daysBetween(task.dueDate, todayStr()) : 0;
  var untranslated = isTitleUntranslated(task);
  var canPropose = task.status !== 'completed' && task.status !== 'missed';
  return '<div class="task-card st-' + cls + '">' +
    (criticalNoteText(task) ? '<div class="critical-note-banner"><span class="icon">📌</span><span><strong>' + t('criticalLabel') + ':</strong> ' + escapeHtml(criticalNoteText(task)) + '</span></div>' : '') +
    '<div class="task-title">' + escapeHtml(taskTitle(task)) + (untranslated ? ' <span class="untranslated-note">' + t('originalLanguageNote') + '</span>' : '') + '</div>' +
    '<div class="task-meta">' +
      statusBadge(task) +
      priorityBadge(task.priority) +
      (task.startDate ? '<span>🚀 ' + t('startDate') + ': ' + fmtDate(task.startDate) + '</span>' : '') +
      '<span>📅 ' + t('due') + ': ' + fmtDate(task.dueDate) + '</span>' +
      (cls === 'overdue' && delay > 0 ? '<span style="color:var(--red);font-weight:600">' + t('overdueDays', delay) + '</span>' : '') +
      (cls === 'completed' && task.completedDate ? '<span style="color:var(--green)">✓ ' + t('completedOn') + ' ' + fmtDate(task.completedDate) + '</span>' : '') +
    '</div>' +
    renderSubtasks(subtasks) +
    (canPropose ?
      '<div class="propose-row">' +
        '<button class="propose-btn" onclick="openProposeComplete(\'' + task.id + '\')">✓ ' + t('markCompleteBtn') + '</button>' +
        '<button class="propose-btn secondary" onclick="openProposeNote(\'' + task.id + '\')">📝 ' + t('addNoteBtn') + '</button>' +
      '</div>' : '') +
  '</div>';
}

function renderProjectFiles(attachments) {
  if (!attachments || !attachments.length) return '';
  return '<div class="project-files-divider"><span class="project-files-divider-label">📎 ' + t('projectFiles') + '</span></div>' +

function loadPartnerView() {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var app = document.getElementById('app');

  if (!token) {
    app.innerHTML = '<div class="state-box"><div class="icon">🔒</div><div class="msg">' + t('noAccess') + '<br>' + t('noAccessSub') + '</div></div>';
    return;
  }

  // Never let this hang indefinitely — if the Edge Function doesn't respond
  // within 15 seconds (cold start, network issue, or a server-side error),
  // show a clear message instead of leaving the page stuck on the spinner
  // with no feedback at all.
  var controller = new AbortController();
  var timeoutId = setTimeout(function() { controller.abort(); }, 15000);

  fetch(FUNCTION_URL + '?token=' + encodeURIComponent(token), {
    headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
    signal: controller.signal
  }).then(function(res) {
    clearTimeout(timeoutId);
    if (!res.ok) {
      app.innerHTML = '<div class="state-box"><div class="icon">🔒</div><div class="msg">' + t('invalidLink') + '<br>' + t('contactSoe') + '</div></div>';
      return null;
    }
    return res.json();
  }).then(function(data) {
    if (!data) return;
    lastData = data;
    (data.tasks || []).forEach(normalizeTaskTitles);
    render(data);
    // Fill in whichever slot is missing for the current language, in the background.
    ensureTitlesForLang(data, currentLang).then(function() { render(data); });
  }).catch(function(err) {
    clearTimeout(timeoutId);
    var timedOut = err && err.name === 'AbortError';
    app.innerHTML = '<div class="state-box"><div class="icon">⚠️</div><div class="msg">' +
      (timedOut ? t('loadTimeout') : t('loadError')) + '<br>' + t('tryAgain') +
      '</div><button class="retry-btn" onclick="loadPartnerView()">' + t('retryBtn') + '</button></div>';
  });
}

function render(data) {
  var app = document.getElementById('app');
  var tasks = data.tasks || [];
  var projects = data.projects || [];
  var mainTasks = tasks.filter(function(tk){ return !tk.parentId; });
  var completed = mainTasks.filter(function(tk){ return tk.status === 'completed'; }).length;
  var open = mainTasks.filter(function(tk){ return tk.status !== 'completed' && tk.status !== 'missed'; }).length;

  var byProject = {};
  mainTasks.forEach(function(tk) { (byProject[tk.projectId] = byProject[tk.projectId] || []).push(tk); });

  var projectSections = projects
    .filter(function(p){ return (byProject[p.id] || []).length > 0; })
    .map(function(p) {
      var items = byProject[p.id].slice().sort(function(a, b) {
        var rank = { open: 0, overdue: 0, completed: 1, missed: 1 };
        var ac = taskStatusClass(a), bc = taskStatusClass(b);
        if (ac === 'overdue' && bc !== 'overdue') return -1;
        if (bc === 'overdue' && ac !== 'overdue') return 1;
        var rankDiff = (rank[ac] != null ? rank[ac] : 1) - (rank[bc] != null ? rank[bc] : 1);
        if (rankDiff !== 0) return rankDiff;
        // Within the same group: open/overdue tasks sort by due date, soonest
        // first (most urgent surfaces immediately). Completed tasks sort by
        // completion date, most recent first (what just got finished shows
        // before older history). Previously there was no date ordering at
        // all within a group — tasks just sat in arbitrary storage order.
        if (ac === 'completed' || ac === 'missed') {
          return (b.completedDate || '').localeCompare(a.completedDate || '');
        }
        return (a.dueDate || '9999').localeCompare(b.dueDate || '9999');
      });
function renderBigPicture(p) {
  var bp = p.bigPicture;
  if (!bp || !bp.totalTasks) return '';
  var lightConfig = {
    onTrack: { color: 'var(--green)', bg: 'var(--green-bg)', label: t('statusOnTrack') },
    atRisk: { color: 'var(--amber)', bg: 'var(--amber-bg)', label: t('statusAtRisk') },
    delayed: { color: 'var(--red)', bg: 'var(--red-bg)', label: t('statusDelayed') },
  };
  var cfg = lightConfig[bp.statusLight] || lightConfig.onTrack;
  return '<div class="big-picture">' +
    '<div class="bp-row">' +
      '<div class="bp-progress-label">' + t('overallProgress') + '</div>' +
      '<span class="bp-status-badge" style="background:' + cfg.bg + ';color:' + cfg.color + '">● ' + cfg.label + '</span>' +
    '</div>' +
    '<div class="bp-bar-track"><div class="bp-bar-fill" style="width:' + bp.progressPercent + '%;background:' + cfg.color + '"></div></div>' +
    '<div class="bp-footer">' +
      '<span>' + bp.progressPercent + '% ' + t('complete') + ' (' + bp.completedTasks + '/' + bp.totalTasks + ')</span>' +
      '<span>' + t('yourShare', p.yourTaskCount || 0, bp.totalTasks) + '</span>' +
    '</div>' +
  '</div>';
}

      var cardsHtml = items.map(function(tk) {
        var subtasks = tasks.filter(function(st){ return st.parentId === tk.id; });
        return renderTaskCard(tk, subtasks);
      }).join('');
      var overdueCount = items.filter(function(tk){ return taskStatusClass(tk) === 'overdue'; }).length;
      var delayBox = overdueCount > 0
        ? '<div class="delay-impact-box"><span class="icon">⚠️</span><span>' + (overdueCount === 1 ? t('delayImpactOne') : t('delayImpactMany', overdueCount)) + '</span></div>'
        : '';
      return '<div class="project-section">' +
        '<div class="project-head"><div><div class="project-eyebrow">' + t('projectLabel') + '</div><div class="project-name">📁 ' + escapeHtml(projectName(p)) + '</div></div></div>' +
        renderBigPicture(p) +
        delayBox +
        cardsHtml +
        renderProjectFiles(p.attachments) +
      '</div>';
    }).join('');

  app.innerHTML =
    '<div class="header">' +
      '<img class="header-logo" src="' + SCE_LOGO + '" alt="SOE">' +
      '<div class="header-brand-text">' + t('brandLine') + '</div>' +
      '<div class="header-divider"></div>' +
      '<div class="header-partner-label">' + t('preparedFor') + '</div>' +
      '<div class="header-partner">' + escapeHtml(partnerDisplayName(data.partner)) + '</div>' +
      '<div class="header-meta">' + t('lastUpdated') + ': ' + fmtDateTime(data.generatedAt) + '</div>' +
    '</div>' +
    '<div class="kpi-strip">' +
      '<div class="kpi k-total"><div class="kpi-label">' + t('totalTasks') + '</div><div class="kpi-value">' + mainTasks.length + '</div></div>' +
      '<div class="kpi k-done"><div class="kpi-label">' + t('completed') + '</div><div class="kpi-value">' + completed + '</div></div>' +
      '<div class="kpi k-open"><div class="kpi-label">' + t('open') + '</div><div class="kpi-value">' + open + '</div></div>' +
    '</div>' +
    (mainTasks.length === 0 ? '<div class="state-box"><div class="icon">✅</div><div class="msg">' + t('noTasks') + '</div></div>' : projectSections) +
    '<div class="footer-note">' + t('footer') + '</div>';
}

setLang(currentLang);
// ── Propose changes — never writes directly to the real task. Submits to
// pending_changes via the Edge Function, which verifies the task genuinely
// belongs to this partner before accepting anything. You/Karim approve or
// reject in the main app. ──
function getCurrentToken() {
  return new URLSearchParams(window.location.search).get('token');
}

function submitProposal(taskId, changeType, noteText, attachmentLink) {
  var token = getCurrentToken();
  if (!token) return Promise.reject(new Error('no token'));
  return fetch(FUNCTION_URL, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, taskId: taskId, changeType: changeType, noteText: noteText || '', attachmentLink: attachmentLink || '' }),
  }).then(function(res) {
    if (!res.ok) throw new Error('failed');
    return res.json();
  });
}

// Mark Complete now opens the same kind of modal as Add Note — optional
// comment, optional link to a file (e.g. Google Drive) — instead of a bare

  }).then(function(res) { return res.ok ? res.json() : null; })
    .then(function(data) {
      var listEl = document.getElementById('submissions-list');
      if (!listEl) return; // modal already closed
      if (!data || !data.proposals) { listEl.textContent = t('submissionsLoadError'); return; }
      if (data.proposals.length === 0) { listEl.textContent = t('submissionsEmpty'); return; }
      listEl.innerHTML = data.proposals.map(function(p) {
        var statusClass = p.status; // 'pending' | 'approved' | 'rejected'
        var statusLabel = p.status === 'pending' ? t('statusPending') : p.status === 'approved' ? t('statusApproved') : t('statusRejected');
        var changeLabel = p.changeType === 'complete' ? t('submissionChangeComplete') : t('submissionChangeNote');
        return '<div class="submission-row">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +
            '<div style="font-size:13px;font-weight:500">' + escapeHtml(p.taskTitle || '(task unavailable)') + '</div>' +
            '<span class="submission-status-badge ' + statusClass + '">' + statusLabel + '</span>' +
          '</div>' +
          '<div style="font-size:11.5px;color:var(--ink-faint);margin-top:3px">' + escapeHtml(changeLabel) + ' · ' + fmtDate((p.createdAt || '').slice(0,10)) + '</div>' +
          (p.noteText ? '<div style="font-size:12px;color:var(--ink-muted);margin-top:4px">' + escapeHtml(p.noteText) + '</div>' : '') +
          (p.status === 'rejected' && p.rejectionReason ? '<div class="submission-reject-reason">' + t('rejectionReasonLabel') + ': ' + escapeHtml(p.rejectionReason) + '</div>' : '') +
        '</div>';
      }).join('');
    }).catch(function() {
      var listEl = document.getElementById('submissions-list');
      if (listEl) listEl.textContent = t('submissionsLoadError');
    });
}

loadPartnerView();
</script>
</body>
</html>
